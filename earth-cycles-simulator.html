function mW(s,an=0){

fert:["🌾 Fertiliser overdose",()=>{S.nitrogen.fert=100;S.earth.fert=100;S.nitrogen.pool+=25},"Crops can't use the surplus, so nitrate leaches and N₂O rises."],
forest:["🌲 Reforestation",()=>{S.water.veg+=30;S.carbon.defo-=30;S.earth.defo-=30;S.carbon.co2-=5},"New trees draw down CO₂ and slow runoff."]};
function fire(k){const n=Date.now();if(n-lastEv<1500)return;lastEv=n;EV[k][1]();["water","nitrogen","carbon","earth"].forEach(c=>{for(const x in S[c])if(typeof S[c][x]=="number")S[c][x]=Math.max(0,S[c][x])});S.water.table=Math.min(100,S.water.table);S.nitrogen.pool=Math.min(100,S.nitrogen.pool);syncCtl();update();const t=$("#toast");t.textContent=EV[k][0]+" — "+EV[k][2];t.style.display="block";clearTimeout(t._t);t._t=setTimeout(()=>t.style.display="none",4500)}
/* ===== QUIZ ===== */
const R=(a,b)=>Math.round(a+Math.random()*(b-a));
const QS=[()=>{const a=R(0,10),b=a+12,x=mW({...PRE.water.Today,T:a}).raw.ev,y=mW({...PRE.water.Today,T:b}).raw.ev;return{q:"Temperature rises from "+a+" °C to "+b+" °C, nothing else changes. Evaporation…",o:["Rises","Falls","Barely changes"],a:y>x*1.1?0:y<x*.9?1:2,w:"Model evaporation goes from "+pc(x)+" to "+pc(y)+" because warmer air holds more vapour."}},
()=>{const x=mW({...PRE.water.Today,imp:10}).raw.ro,y=mW({...PRE.water.Today,imp:75}).raw.ro;return{q:"Impervious surface rises from 10 % to 75 %. Runoff…",o:["Rises","Falls","Unchanged"],a:y>x?0:1,w:"Runoff goes from "+pc(clamp(x))+" to "+pc(clamp(y))+" since pavement blocks infiltration."}},
()=>{const a=mN({...PRE.nitrogen.Today,fert:40}),b=mN({...PRE.nitrogen.Today,fert:100}),gy=b.raw.up/a.raw.up-1,gl=b.raw.lch/a.raw.lch-1;return{q:"Fertiliser goes 40 % → 100 %. Which rises by the larger percentage?",o:["Crop yield","Nitrate leaching","Both equally"],a:gl>gy?1:0,w:"Yield rises "+Math.round(gy*100)+" % while leaching rises "+Math.round(gl*100)+" %: yield saturates, leaching doesn't."}},
()=>{const x=mC({...PRE.carbon.Today,co2:280}).raw.gpp,y=mC({...PRE.carbon.Today,co2:840}).raw.gpp,r=y/x;return{q:"CO₂ triples (280 → 840 ppm), water unchanged. Photosynthesis…",o:["Triples","Rises by less than 1.5×","Rises 1.5–2.5×"],a:r>2.5?0:r<1.5?1:2,w:"Model photosynthesis rises "+r.toFixed(2)+"× — it saturates because other factors then limit it."}},
()=>{const x=mC({...PRE.carbon.Today,sst:5}).raw.oc,y=mC({...PRE.carbon.Today,sst:25}).raw.oc;return{q:"Ocean warms from 5 °C to 25 °C. The ocean CO₂ sink…",o:["Strengthens","Weakens","Unchanged"],a:y<x?1:0,w:"Sink goes from "+x.toFixed(1)+" to "+y.toFixed(1)+" GtC/yr as warm water dissolves less CO₂."}}];
let qi=0,sc=0;
function quiz(){const best=(()=>{try{return localStorage.getItem("qbest")||0}catch(e){return 0}})();const d=$("#quiz");
 if(qi>=QS.length){try{if(sc>best)localStorage.setItem("qbest",sc)}catch(e){}d.innerHTML="<h3>Quiz</h3><p>Score "+sc+" / "+QS.length+" · best "+Math.max(sc,best)+"</p><button id='qr'>Restart</button>";$("#qr").onclick=()=>{qi=0;sc=0;qs=null;quiz()};return}
 if(!qs)qs=QS.map(f=>f());const q=qs[qi];d.innerHTML="<h3>Question "+(qi+1)+" of "+QS.length+" · best "+best+"</h3><div class='bar'><i style='width:"+pc(qi/QS.length)+"'></i></div><p><b>"+esc(q.q)+"</b></p>"+q.o.map((o,i)=>"<button data-a='"+i+"'>"+esc(o)+"</button>").join("")+"<p id='qf' aria-live='polite'></p>";
 d.onclick=e=>{const b=e.target.closest("[data-a]");if(!b||d.dataset.done==qi)return;d.dataset.done=qi;const ok=+b.dataset.a==q.a;if(ok)sc++;$("#qf").innerHTML=(ok?"✅ Correct. ":"❌ Not quite. ")+esc(q.w)+" <button id='qn'>Next</button>";$("#qn").onclick=()=>{qi++;quiz()}}};
let qs=null;
/* ===== TABS, HASH, EXPORT ===== */
function hash(){if(!SL[tab])return;history.replaceState(null,"","#cycle="+tab+SL[tab].map(s=>"&"+s[0]+"="+Math.round(S[tab][s[0]])).join(""))}
function setTab(t){stopRun();tab=t;document.querySelectorAll("#tabs button").forEach(b=>b.setAttribute("aria-selected",b.dataset.t==t));const q=t=="quiz";$("#main").hidden=q;$("#conc").hidden=q;$("#quizsec").hidden=!q;if(q){qi=0;sc=0;qs=null;quiz();return}hist=[[],[],[]];year=0;buildLeft();M=MODEL[tab]();buildRight();update();hash()}
function copy(t){try{navigator.clipboard.writeText(t)}catch(e){const a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();document.execCommand("copy");a.remove()}}
function init(){$("#ttl").textContent=STR.ttl;$("#sub").textContent=STR.sub;
 $("#tabs").innerHTML=Object.keys(NAME).map(k=>'<button role="tab" data-t="'+k+'" aria-selected="false">'+NAME[k]+"</button>").join("");
 $("#tabs").onclick=e=>{const b=e.target.closest("[data-t]");b&&setTab(b.dataset.t)};
 $("#tabs").onkeydown=e=>{const k=Object.keys(NAME),i=k.indexOf(tab);if(e.key=="ArrowRight"||e.key=="ArrowLeft"){setTab(k[(i+(e.key=="ArrowRight"?1:k.length-1))%k.length]);$("#tabs [aria-selected=true]").focus()}};
 try{if(localStorage.getItem("theme")=="dark")document.documentElement.dataset.theme="dark"}catch(e){}
 $("#dark").onclick=()=>{const d=document.documentElement.dataset.theme=="dark";document.documentElement.dataset.theme=d?"":"dark";try{localStorage.setItem("theme",d?"light":"dark")}catch(e){}};
 $("#lnk").onclick=()=>copy(location.href);
 $("#sum").onclick=()=>M&&copy(NAME[tab]+" — "+M.m.map(x=>x.l+": "+x.t).join("; ")+". "+M.eq);
 $("#csv").onclick=()=>{if(!M)return;const r=M.raw,a=document.createElement("a");a.href=URL.createObjectURL(new Blob([Object.keys(r).join(",")+"\n"+Object.values(r).join(",")],{type:"text/csv"}));a.download=tab+".csv";a.click()};
 const h=new URLSearchParams(location.hash.slice(1)),c=h.get("cycle");
 if(c&&SL[c])for(const[k,v]of h)if(k in S[c]&&!isNaN(+v))S[c][k]=+v;
 for(const k in MODEL){const keep=tab;tab=k;BASE[k]=MODEL[k]();tab=keep}
 setTab(c&&SL[c]?c:"water");if(!reduce)requestAnimationFrame(frame)}
init();
})();
